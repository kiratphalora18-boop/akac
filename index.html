<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#211914" />
  <meta name="description" content="A note for readers: something is cooking. Stay tuned for 19 November 2026." />
  <title>A Note for You — 19 November 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --desk: #211914;
      --paper: #f4e8d1;
      --paper-edge: #dfc9a6;
      --ink: #392a20;
      --soft-ink: #725c49;
      --rust: #a8513b;
      --gold: #a67a3f;
    }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { min-height: 100%; background: var(--desk); }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 5vw, 52px);
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 100%, rgba(132, 69, 43, .25), transparent 55%),
        repeating-linear-gradient(0deg, transparent 0 74px, rgba(255, 255, 255, .012) 75px 76px),
        linear-gradient(135deg, #2c211a, #17110e 78%);
      font-family: "DM Sans", sans-serif;
    }
    .site-link {
      position: fixed;
      z-index: 5;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid rgba(255, 208, 138, .42);
      border-radius: 999px;
      background: rgba(32, 22, 17, .86);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .24);
      color: #ffe0ad;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      transition: background .2s ease, transform .2s ease;
    }
    .site-link:hover { background: rgba(108, 62, 39, .95); transform: translateY(-2px); }
    .site-link:focus-visible { outline: 2px solid #ffe0ad; outline-offset: 3px; }
    .letter-wrap { position: relative; width: min(100%, 700px); }
    .letter-wrap::before {
      position: absolute;
      inset: 13px -10px -12px 10px;
      border: 1px solid rgba(226, 190, 137, .16);
      background: #9e7851;
      content: "";
      transform: rotate(1.2deg);
      box-shadow: 0 20px 45px rgba(0, 0, 0, .3);
    }
    .letter {
      position: relative;
      overflow: hidden;
      padding: clamp(32px, 7vw, 70px) clamp(27px, 8vw, 78px);
      border: 1px solid rgba(98, 66, 39, .2);
      background:
        linear-gradient(90deg, transparent 0 45px, rgba(168, 81, 59, .13) 46px, transparent 47px),
        repeating-linear-gradient(180deg, transparent 0 37px, rgba(113, 92, 73, .12) 38px, transparent 39px),
        radial-gradient(ellipse at 10% 6%, rgba(255, 255, 255, .75), transparent 35%),
        var(--paper);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .38), inset 0 0 55px rgba(133, 93, 48, .08);
      animation: unfold .65s ease-out both;
    }
    .letter::after {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(141, 108, 68, .16);
      content: "";
      pointer-events: none;
    }
    .letter-top, .letter-body, .letter-signoff { position: relative; z-index: 1; }
    .letter-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 19px; border-bottom: 1px solid rgba(91, 65, 44, .2); }
    .sender { color: var(--soft-ink); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .stamp { display: grid; width: 43px; height: 43px; flex: 0 0 43px; place-items: center; border: 1px solid rgba(168, 81, 59, .5); border-radius: 50%; color: var(--rust); font-family: "Playfair Display", Georgia, serif; font-size: 19px; font-style: italic; transform: rotate(-10deg); }
    .letter-body { padding-top: 33px; }
    .salutation { margin: 0 0 23px; color: var(--soft-ink); font-family: "Playfair Display", Georgia, serif; font-size: clamp(19px, 3vw, 24px); font-style: italic; }
    h1 { margin: 0; font-family: "Playfair Display", Georgia, serif; font-size: clamp(39px, 8vw, 70px); font-weight: 600; letter-spacing: -.045em; line-height: 1.04; text-wrap: balance; }
    h1 span { color: var(--rust); font-style: italic; }
    .message { max-width: 470px; margin: 24px 0 0; color: #594636; font-family: "Playfair Display", Georgia, serif; font-size: clamp(16px, 2.7vw, 20px); line-height: 1.9; }
    .message strong { color: var(--rust); font-weight: 600; }
    .countdown { margin-top: 24px; }
    .countdown-label { margin: 0 0 10px; color: var(--soft-ink); font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .countdown-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; max-width: 390px; }
    .countdown-unit { display: grid; gap: 4px; justify-items: center; padding: 10px 5px 8px; border-top: 1px solid rgba(91, 65, 44, .25); border-bottom: 1px solid rgba(91, 65, 44, .15); }
    .countdown-number { color: var(--rust); font: 600 clamp(20px, 4vw, 28px)/1 "Playfair Display", Georgia, serif; font-variant-numeric: tabular-nums; }
    .countdown-unit-label { color: var(--soft-ink); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
    .countdown.is-arrived .countdown-label { color: var(--rust); }
    .letter-signoff { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 34px; padding-top: 19px; border-top: 1px solid rgba(91, 65, 44, .2); }
    .signoff-copy { color: var(--soft-ink); font-family: "Playfair Display", Georgia, serif; font-size: 16px; font-style: italic; line-height: 1.6; }
    .signoff-copy strong { display: block; margin-top: 2px; color: var(--ink); font-size: 21px; font-style: normal; font-weight: 600; }
    .date { color: var(--soft-ink); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-align: right; text-transform: uppercase; }
    @keyframes unfold { from { opacity: 0; transform: translateY(10px) rotate(-.5deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
    @media (max-width: 520px) {
      body { padding: 22px 18px; }
      .site-link { top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); min-height: 40px; padding: 0 13px; font-size: 10px; }
      .letter-wrap::before { inset: 8px -5px -7px 5px; }
      .letter { background-position: 0 0, 0 0, 0 0; }
      .letter-top { padding-bottom: 14px; }
      .letter-body { padding-top: 25px; }
      .countdown-grid { gap: 5px; }
      .countdown-unit { padding: 9px 2px 7px; }
      .letter-signoff { align-items: flex-start; flex-direction: column; gap: 12px; margin-top: 26px; }
      .date { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="letter-wrap" aria-labelledby="letter-title">
    <article class="letter">
      <header class="letter-top">
        <p class="sender">A little note for you!</p>
        <span class="stamp" aria-hidden="true">S</span>
      </header>
      <section class="letter-body">
        <p class="salutation">Dear Sheen,</p>
        <h1 id="letter-title">Something is <span>cooking.</span></h1>
        <p class="message"> I can’t share all the details just yet, but it won’t be long. <strong>Stay tuned.</strong></p>
        <section class="countdown" id="countdown" aria-label="Countdown to 19 November 2026">
          <p class="countdown-label" id="countdownLabel">Counting down </p>
          <div class="countdown-grid" aria-live="off">
            <div class="countdown-unit"><span class="countdown-number" id="countdownDays">--</span><span class="countdown-unit-label">Days</span></div>
            <div class="countdown-unit"><span class="countdown-number" id="countdownHours">--</span><span class="countdown-unit-label">Hours</span></div>
            <div class="countdown-unit"><span class="countdown-number" id="countdownMinutes">--</span><span class="countdown-unit-label">Minutes</span></div>
            <div class="countdown-unit"><span class="countdown-number" id="countdownSeconds">--</span><span class="countdown-unit-label">Seconds</span></div>
          </div>
        </section>
      </section>
      <footer class="letter-signoff">
        <p class="signoff-copy">Until then,<strong>See you soon.</strong></p>
        <p class="date">Coming your way<br />19 November 2026</p>
      </footer>
    </article>
  </main>
  <script>
    (function () {
      const target = new Date(2026, 10, 19, 0, 0, 0);
      const countdown = document.getElementById('countdown');
      const label = document.getElementById('countdownLabel');
      const units = {
        days: document.getElementById('countdownDays'),
        hours: document.getElementById('countdownHours'),
        minutes: document.getElementById('countdownMinutes'),
        seconds: document.getElementById('countdownSeconds')
      };
      let timer;
      function updateCountdown() {
        const remaining = Math.max(0, target.getTime() - Date.now());
        const seconds = Math.floor(remaining / 1000);
        units.days.textContent = String(Math.floor(seconds / 86400)).padStart(2, '0');
        units.hours.textContent = String(Math.floor(seconds % 86400 / 3600)).padStart(2, '0');
        units.minutes.textContent = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
        units.seconds.textContent = String(seconds % 60).padStart(2, '0');
        if (remaining === 0) {
          label.textContent = 'The day is here';
          countdown.classList.add('is-arrived');
          clearInterval(timer);
        }
      }
      updateCountdown();
      if (target.getTime() > Date.now()) timer = window.setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
