<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8ee" />
  <meta name="description" content="A birthday celebration for Sheen is on its way. Join us on 19 November 2026." />
  <title>A Birthday Surprise for You — 19 November 2026</title>
  <script>
    try { if (localStorage.getItem('birthday-theme') === 'dark') document.documentElement.classList.add('dark-mode'); } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --cream: #080b18;
      --warm: #12152b;
      --gold: #f4ff4e;
      --deep: #ecf5ff;
      --blush: #ff4fd8;
      --rose: #ff38a8;
      --teal: #29f2d0;
      --violet: #9e55ff;
      --muted: #c3cde1;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--cream);
      scrollbar-width: thin;
      scrollbar-color: var(--rose) #090c1b;
    }

    html::-webkit-scrollbar {
      width: 12px;
    }

    html::-webkit-scrollbar-track {
      background: #090c1b;
      border-left: 1px solid #29f2d044;
    }

    html::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #f4ff4e, #ff38a8, #29f2d0);
      border: 3px solid #090c1b;
      border-radius: 999px;
    }

    html::-webkit-scrollbar-button {
      display: none;
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 5vw, 52px);
      overflow-x: hidden;
      color: var(--deep);
      font-family: "Lato", sans-serif;
      font-weight: 300;
      background:
        radial-gradient(ellipse at 50% 35%, #6829a555, transparent 42%),
        radial-gradient(ellipse at 15% 80%, #ff38a82b, transparent 35%),
        radial-gradient(ellipse at 50% 100%, #29f2d02b, transparent 60%),
        linear-gradient(145deg, #080b18, #11142c 60%, #090c1b);
    }

    /* Neon grid, same as the main page */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .14;
      background-image: linear-gradient(#29f2d033 1px, transparent 1px), linear-gradient(90deg, #29f2d033 1px, transparent 1px);
      background-size: 42px 42px;
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 85%);
      mask-image: linear-gradient(to bottom, #000, transparent 85%);
    }

    /* Custom cursor (mouse only) */
    #cursor,
    #cursor-ring {
      display: none;
    }

    @media (hover: hover) and (pointer: fine) {
      * {
        cursor: none;
      }

      #cursor,
      #cursor-ring {
        display: block;
        position: fixed;
        pointer-events: none;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        left: -100px;
        top: -100px;
      }

      #cursor {
        width: 12px;
        height: 12px;
        z-index: 9999;
        background: #f4ff4e;
        mix-blend-mode: screen;
        box-shadow: 0 0 18px #f4ff4e;
        transition: width .3s ease, height .3s ease;
      }

      #cursor-ring {
        width: 36px;
        height: 36px;
        z-index: 9998;
        border: 1.5px solid #29f2d0;
        opacity: .8;
        box-shadow: 0 0 18px #29f2d066;
        transition: width .3s ease, height .3s ease, opacity .3s ease;
      }
    }

    .site-link {
      position: fixed;
      z-index: 5;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid #f4ff4e;
      border-radius: 5px;
      background: linear-gradient(110deg, #ff38a8, #9e55ff 55%, #18cdb6);
      box-shadow: 0 0 24px #ff38a855, inset 0 0 14px #ffffff22;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-shadow: 0 1px 8px #080b1888;
      text-transform: uppercase;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .site-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 34px #ff38a899, 0 0 70px #29f2d044;
    }

    .site-link:focus-visible {
      outline: 3px solid #f4ff4e;
      outline-offset: 4px;
    }

    /* Warm birthday invitation */
    :root {
      color-scheme: light;
      --cream: #fff9f0;
      --warm: #ffecd9;
      --gold: #d68c24;
      --deep: #49344c;
      --blush: #ffd8e3;
      --rose: #d85679;
      --teal: #398f83;
      --muted: #766879;
    }
    html { background: var(--cream); scrollbar-color: #d85679 #fff0d5; }
    html::-webkit-scrollbar-track { background: #fff0d5; border-left-color: #49344c12; }
    html::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #f2bc83, #d85679, #aa8acb); border-color: #fff0d5; }
    body {
      color: var(--deep);
      background:
        radial-gradient(ellipse at 12% 14%, #ffe0e9 0, transparent 35%),
        radial-gradient(ellipse at 90% 82%, #fce6d2 0, transparent 36%),
        linear-gradient(145deg, #fffaf3, #fff1e9 58%, #f7eff8);
    }
    body::before {
      opacity: .35;
      background-image: radial-gradient(circle, #d8567936 1px, transparent 1.5px);
      background-size: 30px 30px;
      mask-image: linear-gradient(to bottom, #000, transparent 80%);
    }
    .site-link {
      top: max(22px, env(safe-area-inset-top));
      border: 1px solid #d85679;
      border-radius: 999px;
      background: #d85679;
      box-shadow: 0 10px 24px #d8567930;
      color: #fff;
      text-shadow: none;
    }
    .site-link:hover { box-shadow: 0 14px 30px #d8567945; }
    .site-link:focus-visible { outline-color: #aa8acb; }
    .letter {
      border: 1px solid #e9cad2;
      border-radius: 28px;
      background: #fffdf9;
      box-shadow: 0 28px 80px #49344c12, inset 0 1px #fff;
    }
    .letter::before {
      background: radial-gradient(circle at 94% 2%, #fde3ea 0, transparent 37%), radial-gradient(circle at 4% 100%, #f8e9f6 0, transparent 42%);
    }
    .sender { color: #766879; text-shadow: none; }
    .stamp {
      border: 1px solid #d85679;
      border-radius: 50%;
      color: #d85679;
      text-shadow: none;
      box-shadow: 0 5px 14px #d8567920;
    }
    .salutation { color: #766879; }
    .letter h1 { color: #49344c; text-shadow: none; }
    .letter h1 span { color: #d85679; text-shadow: none; }
    .message, .signoff-copy, .date { color: #766879; }
    .countdown { border: 1px solid #eed3da; border-radius: 20px; background: #fff8f5; }
    .countdown-label { color: #766879; }
    .countdown-unit { border: 1px solid #f0dce0; border-radius: 14px; background: #fffdf9; color: #d85679; }
    .countdown-unit-label { color: #766879; }
    .letter-signoff { border-color: #49344c18; }
    #cursor { background: #d85679; mix-blend-mode: multiply; box-shadow: 0 0 14px #d8567930; }
    #cursor-ring { border-color: #aa8acb; box-shadow: 0 0 14px #aa8acb30; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    .letter-wrap {
      position: relative;
      z-index: 1;
      width: min(100%, 700px);
    }

    .letter {
      position: relative;
      overflow: hidden;
      padding: clamp(32px, 7vw, 66px) clamp(26px, 7vw, 66px);
      border: 1px solid #29f2d0;
      border-radius: 8px;
      background: linear-gradient(145deg, #17182f, #0a1020);
      box-shadow: 0 0 0 4px #29f2d010, 0 0 60px #ff38a833, 0 0 100px #29f2d022, inset 0 0 24px #ff38a811;
      animation: boot .7s cubic-bezier(.22, 1, .36, 1) both;
    }

    .letter::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      content: "";
      pointer-events: none;
      background: radial-gradient(ellipse at 85% 0%, #6127a644, transparent 45%), radial-gradient(ellipse at 10% 100%, #29f2d01c, transparent 50%);
    }

    .letter-top,
    .letter-body,
    .letter-signoff {
      position: relative;
      z-index: 1;
    }

    .letter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 19px;
      border-bottom: 1px solid #29f2d033;
    }

    .sender {
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
      text-shadow: 0 0 16px #29f2d066;
      text-transform: uppercase;
    }

    .stamp {
      display: grid;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      place-items: center;
      border: 1px solid #f4ff4e;
      border-radius: 6px;
      color: #f4ff4e;
      text-shadow: 0 0 14px #f4ff4e88;
      box-shadow: 0 0 18px #f4ff4e33, inset 0 0 12px #f4ff4e1a;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 20px;
      font-style: italic;
      font-weight: 700;
      transform: rotate(-8deg);
    }

    .letter-body {
      padding-top: 33px;
    }

    .salutation {
      margin: 0 0 22px;
      color: var(--muted);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(19px, 3vw, 24px);
      font-style: italic;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(40px, 8.5vw, 72px);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: .02em;
      color: #f4f7ff;
      text-shadow: 3px 3px 0 #ff38a866, -3px -2px 0 #29f2d055, 0 0 30px #a265ff55;
      text-wrap: balance;
    }

    h1 span {
      color: #f4ff4e;
      font-style: italic;
      text-shadow: 0 0 22px #f4ff4e88;
    }

    .message {
      max-width: 470px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2.7vw, 19px);
      line-height: 1.85;
    }

    .message strong {
      color: var(--teal);
      font-weight: 700;
      text-shadow: 0 0 16px #29f2d066;
    }

    .countdown {
      margin-top: 28px;
    }

    .countdown-label {
      margin: 0 0 12px;
      color: #ecf5ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      max-width: 400px;
    }

    .countdown-unit {
      display: grid;
      gap: 6px;
      justify-items: center;
      padding: 12px 4px 10px;
      border: 1px solid #29f2d088;
      border-radius: 8px;
      background: linear-gradient(135deg, #151a31ef, #1a1030ef);
      box-shadow: 0 0 0 3px #29f2d010, 0 0 24px #29f2d022, inset 0 0 18px #ff38a811;
    }

    .countdown-number {
      color: #f4ff4e;
      text-shadow: 0 0 18px #f4ff4e66;
      font: 700 clamp(22px, 4.6vw, 30px)/1 "Playfair Display", Georgia, serif;
      font-variant-numeric: tabular-nums;
    }

    .countdown-unit-label {
      color: #ecf5ff;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .countdown.is-arrived .countdown-label {
      color: var(--teal);
      text-shadow: 0 0 16px #29f2d066;
    }

    .countdown.is-arrived .countdown-unit {
      border-color: #f4ff4e;
      animation: arcadePulse 2s ease-in-out infinite;
    }

    .letter-signoff {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #29f2d033;
    }

    .signoff-copy {
      color: var(--muted);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.6;
    }

    .signoff-copy strong {
      display: block;
      margin-top: 2px;
      color: #f4f7ff;
      font-size: 21px;
      font-style: normal;
      font-weight: 700;
      text-shadow: 0 0 18px #ff38a866;
    }

    .date {
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      line-height: 1.7;
      text-align: right;
      text-shadow: 0 0 16px #29f2d066;
      text-transform: uppercase;
    }

    @keyframes boot {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
        filter: saturate(.4) brightness(.7);
      }

      to {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @keyframes arcadePulse {

      0%,
      100% {
        filter: saturate(1);
      }

      50% {
        filter: saturate(1.6) brightness(1.12);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 76px 18px 28px;
        place-items: start center;
      }

      .site-link {
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        min-height: 40px;
        padding: 0 14px;
        font-size: 10px;
      }

      .letter-top {
        padding-bottom: 14px;
      }

      .letter-body {
        padding-top: 25px;
      }

      .countdown-grid {
        gap: 6px;
      }

      .countdown-unit {
        padding: 10px 2px 8px;
      }

      .letter-signoff {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
        margin-top: 28px;
      }

      .date {
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* Keep the invitation's birthday colors above the base letter styles. */
    body {
      color: #49344c;
      background: radial-gradient(ellipse at 12% 14%, #ffe0e9, transparent 35%), radial-gradient(ellipse at 90% 82%, #fce6d2, transparent 36%), linear-gradient(145deg, #fffaf3, #fff1e9 58%, #f7eff8);
    }
    body::before { opacity: .35; background-image: radial-gradient(circle, #d8567936 1px, transparent 1.5px); background-size: 30px 30px; }
    .site-link { border: 1px solid #d85679; border-radius: 999px; background: #d85679; box-shadow: 0 10px 24px #d8567930; color: #fff; text-shadow: none; }
    .site-link:hover { box-shadow: 0 14px 30px #d8567945; }
    .site-link:focus-visible { outline-color: #aa8acb; }
    .letter { border: 1px solid #e9cad2; border-radius: 28px; background: #fffdf9; box-shadow: 0 28px 80px #49344c12, inset 0 1px #fff; }
    .letter::before { background: radial-gradient(circle at 94% 2%, #fde3ea, transparent 37%), radial-gradient(circle at 4% 100%, #f8e9f6, transparent 42%); }
    .sender, .salutation, .message, .signoff-copy, .date, .countdown-label, .countdown-unit-label { color: #766879; text-shadow: none; }
    .stamp { border-color: #d85679; border-radius: 50%; color: #d85679; text-shadow: none; box-shadow: 0 5px 14px #d8567920; }
    .letter h1 { color: #49344c; text-shadow: none; }
    .letter h1 span { color: #d85679; text-shadow: none; }
    .countdown {
      width: min(100%, 620px);
      margin: 26px auto 0;
      padding: 20px;
      border: 1px solid #eed3da;
      border-radius: 22px;
      background: #fff8f5;
      box-shadow: 0 12px 32px #49344c0a;
    }
    .countdown-grid { width: 100%; max-width: none; gap: clamp(8px, 2vw, 14px); }
    .countdown-unit {
      min-width: 0;
      min-height: 92px;
      align-content: center;
      gap: 8px;
      padding: 12px 6px;
      border: 1px solid #f0dce0;
      border-radius: 16px;
      background: #fffdf9;
      color: #d85679;
      box-shadow: 0 4px 14px #49344c08;
    }
    .countdown-number { color: #49344c; text-shadow: none; }
    .countdown-unit-label { color: #766879; }
    .letter-signoff { border-color: #49344c18; }
    #cursor { background: #d85679; mix-blend-mode: multiply; box-shadow: 0 0 14px #d8567930; }
    #cursor-ring { border-color: #aa8acb; box-shadow: 0 0 14px #aa8acb30; }
    @media (max-width: 520px) {
      body { background: radial-gradient(ellipse at 12% 14%, #ffe0e9, transparent 35%), radial-gradient(ellipse at 90% 82%, #fce6d2, transparent 36%), linear-gradient(145deg, #fffaf3, #fff1e9 58%, #f7eff8); }
      .countdown { padding: 14px; border-radius: 18px; }
      .countdown-grid { gap: 7px; }
      .countdown-unit { min-height: 78px; padding: 10px 2px; border-radius: 13px; }
      .countdown-number { font-size: clamp(20px, 7vw, 27px); }
      .countdown-unit-label { font-size: 8px; letter-spacing: .08em; }
    }
    .theme-toggle {
      position: fixed;
      z-index: 6;
      top: max(76px, calc(env(safe-area-inset-top) + 76px));
      right: max(22px, env(safe-area-inset-right));
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #e9cad2;
      border-radius: 999px;
      background: #fffdf4eF;
      color: #49344c;
      font: 700 11px "Lato", sans-serif;
      letter-spacing: .04em;
      box-shadow: 0 8px 24px #49344c12;
      cursor: pointer;
    }
    .theme-toggle:hover { border-color: #d85679; }
    .theme-toggle:focus-visible { outline: 3px solid #aa8acb; outline-offset: 3px; }
    html.dark-mode { color-scheme: dark; background: #211c2b; }
    html.dark-mode body {
      color: #f7eaf0;
      background: radial-gradient(ellipse at 12% 14%, #563347, transparent 38%), radial-gradient(ellipse at 90% 82%, #47374e, transparent 40%), linear-gradient(145deg, #211c2b, #2b2233 58%, #242232);
    }
    html.dark-mode body::before { opacity: .2; background-image: radial-gradient(circle, #f3b3ca45 1px, transparent 1.5px); }
    html.dark-mode .letter { border-color: #594454; background: #30283a; box-shadow: 0 28px 80px #100d1890, inset 0 1px #ffffff0d; }
    html.dark-mode .letter::before { background: radial-gradient(circle at 94% 2%, #70405266, transparent 38%), radial-gradient(circle at 4% 100%, #51415c88, transparent 42%); }
    html.dark-mode .sender, html.dark-mode .salutation, html.dark-mode .message, html.dark-mode .signoff-copy, html.dark-mode .date,
    html.dark-mode .countdown-label, html.dark-mode .countdown-unit-label { color: #d5c4d3; }
    html.dark-mode .stamp { border-color: #f09bb7; color: #ffb5c9; }
    html.dark-mode .letter h1 { color: #fff3e9; }
    html.dark-mode .letter h1 span { color: #ff9db8; }

  </style>

<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <a class="site-link" href="main1.html">Open main page <span aria-hidden="true">↗</span></a>
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">🌙 Dark</button>
  <main class="letter-wrap" aria-labelledby="letter-title">
    <article class="letter">
      <header class="letter-top">
      <p class="sender">A birthday surprise for you</p>
        <span class="stamp" aria-hidden="true">S</span>
      </header>
      <section class="letter-body">
        <p class="salutation">Dear Sheen,</p>
        <h1 id="letter-title">Your celebration is <span>almost here.</span></h1>
        <p class="message">Countdown is started the recipe is ready!</p>
        </p>
        <section class="countdown" id="countdown" aria-label="Countdown to 19 November 2026">
          <p class="countdown-label" id="countdownLabel">Counting down </p>
          <div class="countdown-grid" aria-live="off">
            <div class="countdown-unit"><span class="countdown-number" id="countdownDays">--</span><span
                class="countdown-unit-label">Days</span></div>
            <div class="countdown-unit"><span class="countdown-number" id="countdownHours">--</span><span
                class="countdown-unit-label">Hours</span></div>
            <div class="countdown-unit"><span class="countdown-number" id="countdownMinutes">--</span><span
                class="countdown-unit-label">Minutes</span></div>
            <div class="countdown-unit"><span class="countdown-number" id="countdownSeconds">--</span><span
                class="countdown-unit-label">Seconds</span></div>
          </div>
        </section>
      </section>
      <footer class="letter-signoff">
        <p class="signoff-copy">Until the candles are lit,<strong>save a little wish.</strong></p>
        <p class="date">Coming your way<br />19 November 2026</p>
      </footer>
    </article>
  </main>
  <script>
    (function () {
      const themeToggle = document.querySelector('.theme-toggle');
      function setTheme(isDark) {
        document.documentElement.classList.toggle('dark-mode', isDark);
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        themeToggle.textContent = isDark ? '☀️ Light' : '🌙 Dark';
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#211c2b' : '#fff8ee';
        try { localStorage.setItem('birthday-theme', isDark ? 'dark' : 'light'); } catch (_) {}
      }
      setTheme(document.documentElement.classList.contains('dark-mode'));
      themeToggle.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark-mode')));

      // Custom cursor (mouse only)
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        const cur = document.getElementById('cursor');
        const ring = document.getElementById('cursor-ring');
        let mx = 0, my = 0, rx = 0, ry = 0;
        document.addEventListener('mousemove', function (e) {
          mx = e.clientX; my = e.clientY;
          cur.style.left = mx + 'px'; cur.style.top = my + 'px';
        });
        (function animRing() {
          rx += (mx - rx) * 0.13; ry += (my - ry) * 0.13;
          ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
          requestAnimationFrame(animRing);
        })();
        document.querySelectorAll('a').forEach(function (el) {
          el.addEventListener('mouseenter', function () {
            cur.style.width = cur.style.height = '20px';
            ring.style.width = ring.style.height = '52px';
            ring.style.opacity = '0.9';
          });
          el.addEventListener('mouseleave', function () {
            cur.style.width = cur.style.height = '12px';
            ring.style.width = ring.style.height = '36px';
            ring.style.opacity = '0.8';
          });
        });
      }

      // Countdown
      const target = new Date(2026, 10, 19, 0, 0, 0);
      const countdown = document.getElementById('countdown');
      const label = document.getElementById('countdownLabel');
      const units = {
        days: document.getElementById('countdownDays'),
        hours: document.getElementById('countdownHours'),
        minutes: document.getElementById('countdownMinutes'),
        seconds: document.getElementById('countdownSeconds')
      };
      let timer;
      function updateCountdown() {
        const remaining = Math.max(0, target.getTime() - Date.now());
        const seconds = Math.floor(remaining / 1000);
        units.days.textContent = String(Math.floor(seconds / 86400)).padStart(2, '0');
        units.hours.textContent = String(Math.floor(seconds % 86400 / 3600)).padStart(2, '0');
        units.minutes.textContent = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
        units.seconds.textContent = String(seconds % 60).padStart(2, '0');
        if (remaining === 0) {
          label.textContent = 'The day is here';
          countdown.classList.add('is-arrived');
          clearInterval(timer);
        }
      }
      updateCountdown();
      if (target.getTime() > Date.now()) timer = window.setInterval(updateCountdown, 1000);
    })();
  </script>
</body>

</html>
