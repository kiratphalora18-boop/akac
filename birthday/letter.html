<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18202c">
<title>A letter, just for you</title>
<style>
:root{color-scheme:dark;--night:#18202c;--ink:#24364b;--paper:#f4e8ca;--paper-light:#fbf2dc;--sans:"Segoe UI",Arial,sans-serif;--hand:"Segoe Print","Bradley Hand","Lucida Handwriting","URW Chancery L",cursive}
*{box-sizing:border-box}html{min-height:100%;background:var(--night);scrollbar-color:#b79a68 #1b2532;scrollbar-width:thin}*::-webkit-scrollbar{width:9px;height:9px}*::-webkit-scrollbar-track{background:#1b2532}*::-webkit-scrollbar-thumb{border:2px solid #1b2532;border-radius:99px;background:linear-gradient(180deg,#e2c887,#92754b)}*::-webkit-scrollbar-thumb:hover{background:#f0d9a0}body{position:relative;min-height:100svh;margin:0;padding:calc(22px + env(safe-area-inset-top)) 17px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow-x:hidden;color:#eadfcf;font-family:var(--sans);background:radial-gradient(ellipse at 50% 38%,#354052 0,#222b3a 47%,#111824 100%)}
.ambience{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 8% 72%,#cbac6c13,transparent 34%),radial-gradient(ellipse at 94% 20%,#8b9fc21b,transparent 36%)}.ambience:before,.ambience:after{content:"";position:absolute;width:150px;height:1px;left:-180px;top:18%;background:linear-gradient(90deg,transparent,#fff5d6aa,transparent);filter:drop-shadow(0 0 5px #fff1c8);transform:rotate(-24deg);animation:shooting-star 13s linear infinite}.ambience:after{top:67%;animation-delay:7s;animation-duration:17s;opacity:.7}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffebbb;box-shadow:0 0 7px 2px #f5dca877,0 0 18px 4px #d7b77a44;animation:firefly-drift 8s ease-in-out infinite,twinkle 3s ease-in-out infinite alternate}.spark:nth-child(2){left:13%;top:24%;animation-delay:-2s,-1s}.spark:nth-child(3){left:83%;top:19%;animation-delay:-6s,-2s}.spark:nth-child(4){left:89%;top:63%;animation-delay:-3s,-.5s}.spark:nth-child(5){left:9%;top:78%;animation-delay:-5s,-1.5s}.spark:nth-child(6){left:72%;top:88%;animation-delay:-1s,-2.5s}.spark:nth-child(7){left:30%;top:10%;animation-delay:-4s,-1.7s}.spark:nth-child(8){left:96%;top:38%;animation-delay:-7s,-.8s}.spark:nth-child(9){left:4%;top:48%;animation-delay:-2.5s,-2.2s}
.back{position:relative;z-index:1;align-self:flex-start;width:min(100%,620px);margin:0 auto;color:#e3d2b4;text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.84}.back:hover{opacity:1}
.paper{position:relative;z-index:1;isolation:isolate;width:min(100%,620px);min-height:min(720px,calc(100svh - 112px));padding:clamp(34px,9vw,76px) clamp(25px,9vw,78px);overflow:hidden;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(ellipse at 14% 18%,#fff9e990 0,transparent 29%),radial-gradient(ellipse at 88% 78%,#a47f4930 0,transparent 31%),radial-gradient(ellipse at 22% 83%,#c09a5c20 0 1px,transparent 2px),radial-gradient(ellipse at 72% 27%,#8e714330 0 1px,transparent 2px),radial-gradient(ellipse at 47% 57%,#fff9e555 0 1px,transparent 2px),linear-gradient(112deg,#ffffff50 0,transparent 18%,#8062390b 49%,#fff6dc44 78%,#7c60301c 100%);background-size:100% 100%,100% 100%,23px 31px,37px 29px,19px 23px,100% 100%;border-radius:2px 1px 3px 2px;box-shadow:0 32px 90px #0009,0 12px 24px #0006,0 5px 0 -2px #e1d1ae,0 8px 0 -4px #b8a682,0 11px 0 -6px #e5d5b2,inset 0 1px #fff9e0,inset 1px 0 #fff4d099,inset -1px 0 #92764b30,inset 0 -2px 8px #82633a25;transform:rotate(-.35deg);animation:paper-arrive .9s cubic-bezier(.2,.8,.25,1) both}
.paper:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;background:repeating-linear-gradient(0deg,transparent 0 31px,#8492a21c 32px,#8492a21c 33px,transparent 34px),repeating-linear-gradient(91deg,transparent 0 17px,#fff9e31a 18px,transparent 19px),linear-gradient(165deg,transparent 0 28%,#84694308 28.2%,transparent 28.6% 100%);mask-image:linear-gradient(to bottom,transparent 0 105px,#000 140px)}.paper:after{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(90deg,#8e693526,#c7a66d13 35%,transparent);box-shadow:1px 0 #fff9e14a;pointer-events:none}
.date{margin:0 0 34px;text-align:right;font:400 1rem/1.7 var(--hand);color:#42536a;transform:rotate(1deg)}.salutation{margin:0 0 18px;font:400 clamp(1.35rem,5.6vw,2rem)/1.55 var(--hand);color:#24364b}.message{margin:0;font:400 clamp(1.05rem,4.4vw,1.35rem)/1.95 var(--hand);white-space:pre-line;color:#263c56}.signature{margin:36px 0 0 16%;font:400 clamp(1.15rem,4.8vw,1.55rem)/1.7 var(--hand);color:#273c56;transform:rotate(-1deg)}.signature span{display:block;margin-top:7px;font-size:.85em}
.seal{position:absolute;right:clamp(16px,5vw,34px);bottom:clamp(16px,5vw,34px);width:46px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#f5e4c4;background:radial-gradient(circle at 35% 30%,#b96d64,#843e45 65%,#602e39);box-shadow:0 3px 7px #59333d66;font:400 1.1rem var(--hand);transform:rotate(8deg);animation:seal-glow 3.5s ease-in-out 1s infinite}
.secret-star{position:fixed;z-index:4;right:max(15px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));width:48px;height:48px;padding:0;border:1px solid #e7d3a355;border-radius:50%;color:#ffe9b1;background:#25304499;font-size:1.15rem;text-shadow:0 0 8px #fff1be,0 0 20px #ffda88;box-shadow:0 0 18px #f0d99b30;cursor:pointer;animation:star-pulse 2.5s ease-in-out infinite}.secret-star:hover,.secret-star:focus-visible{background:#39465b;color:#fff4cf;box-shadow:0 0 28px #f2d58c99;outline:2px solid #f0d9a0;outline-offset:3px}.secret-note{position:fixed;z-index:5;right:max(18px,env(safe-area-inset-right));top:max(73px,calc(env(safe-area-inset-top) + 68px));width:min(310px,calc(100vw - 36px));padding:21px 42px 21px 22px;border:1px solid #e5cf9a66;border-radius:3px;color:#f4e9d2;background:linear-gradient(145deg,#26334aF5,#171f2df5);box-shadow:0 14px 40px #0008;font:400 1.05rem/1.7 var(--hand);animation:note-arrive .35s ease-out both}.secret-note[hidden]{display:none}.secret-close{position:absolute;top:5px;right:6px;width:38px;height:38px;border:0;background:transparent;color:#e9d8bd;font-size:1.3rem;cursor:pointer}
@keyframes firefly-drift{0%,100%{translate:0 0}50%{translate:14px -22px}}@keyframes twinkle{from{opacity:.32;scale:.7}to{opacity:1;scale:1.25}}@keyframes shooting-star{0%,72%{translate:0 0;opacity:0}74%{opacity:.85}82%{translate:125vw 52vh;opacity:0}100%{translate:125vw 52vh;opacity:0}}@keyframes paper-arrive{from{opacity:0;translate:0 18px;rotate:-1deg}to{opacity:1;translate:0 0;rotate:0}}@keyframes seal-glow{50%{filter:brightness(1.16);box-shadow:0 3px 11px #a76a6777,0 0 14px #d8ad8877}}@keyframes star-pulse{50%{scale:1.12;box-shadow:0 0 23px #f0d99b77}}@keyframes note-arrive{from{opacity:0;translate:0 -8px}to{opacity:1;translate:0 0}}
@media(max-width:480px){body{justify-content:flex-start;gap:14px;padding-left:12px;padding-right:12px}.paper{min-height:calc(100svh - 102px);padding:38px 25px 76px;transform:rotate(-.2deg)}.date{margin-bottom:30px}.signature{margin-top:30px;margin-left:9%}.seal{width:40px}}
@media(orientation:landscape) and (max-height:560px){body{justify-content:flex-start}.paper{min-height:auto;padding-top:28px;padding-bottom:62px}.date{margin-bottom:18px}.signature{margin-top:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="ambience" aria-hidden="true"><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i></div>
<button class="secret-star" id="secretStar" type="button" aria-label="Reveal a hidden birthday message" aria-expanded="false" aria-controls="secretNote">✦</button>
<aside class="secret-note" id="secretNote" role="region" aria-label="A hidden birthday message" hidden><button class="secret-close" id="secretClose" type="button" aria-label="Close hidden message">×</button>Some people make the world feel softer just by being in it. You are one of them. ✦</aside>
<a class="back" href="index.html">← Back to the stars</a>
<main class="paper" aria-label="A handwritten birthday letter">
<p class="date" id="letterDate"></p>
<p class="salutation" id="salutation"></p>
<p class="message" id="message"></p>
<p class="signature" id="signature"></p>
<div class="seal" aria-hidden="true">✦</div>
</main>
<script>
// Personalize the letter here. The page uses local system handwriting fonts and works offline.
const LETTER={salutation:"To my favorite person,",message:"Thank you for making ordinary days feel like something worth keeping.\n\nI feel lucky to have you in my corner. I hope this next trip around the sun brings you the same joy you bring to everyone lucky enough to know you.\n\nHappy birthday, always.",signature:"With all my love,\nYour best friend."};
document.getElementById("letterDate").textContent=new Intl.DateTimeFormat(undefined,{year:"numeric",month:"long",day:"numeric"}).format(new Date());
document.getElementById("salutation").textContent=LETTER.salutation;
document.getElementById("message").textContent=LETTER.message;
document.getElementById("signature").textContent=LETTER.signature;
const secretStar=document.getElementById("secretStar"),secretNote=document.getElementById("secretNote");
function toggleSecretNote(open){secretNote.hidden=!open;secretStar.setAttribute("aria-expanded",String(open));if(open)document.getElementById("secretClose").focus();else secretStar.focus()}
secretStar.addEventListener("click",()=>toggleSecretNote(secretNote.hidden));
document.getElementById("secretClose").addEventListener("click",()=>toggleSecretNote(false));
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!secretNote.hidden)toggleSecretNote(false)});
</script>
</body>
</html>
