<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>A universe, for you</title>
<style>
:root{color-scheme:dark;--night:#070914;--white:#f6eee8;--gold:#efd39e;--rose:#d99ab2;--cyan:#a7dce1;--violet:#a8a1df;--serif:"Iowan Old Style",Baskerville,Georgia,serif;--sans:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:var(--white);font-family:var(--sans);scrollbar-color:#c6a96d66 #111522;scrollbar-width:thin}*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-track{background:#111522}*::-webkit-scrollbar-thumb{border:2px solid #111522;border-radius:99px;background:linear-gradient(180deg,#efd39e,#a88c5c)}*::-webkit-scrollbar-thumb:hover{background:#f6dfae}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
#art{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;touch-action:none}.world{position:relative;height:100dvh;min-height:100svh;isolation:isolate}.scene{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;opacity:0;visibility:hidden;transition:opacity 1.4s ease,visibility 1.4s;pointer-events:none;padding:calc(22px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))}.scene.active{opacity:1;visibility:visible;pointer-events:auto}.scene:focus-visible{outline:1px solid #efd39e88;outline-offset:-9px}.scene:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 54%,transparent 5%,rgba(4,6,17,.08) 50%,rgba(3,5,14,.46) 100%)}
.wordmark{font:400 clamp(1.45rem,4vw,2.4rem)/1.15 var(--serif);letter-spacing:.42em;text-transform:uppercase;text-shadow:0 0 24px #f4dba822}.begin,.portal-enter{position:absolute;left:50%;bottom:max(11vh,65px);transform:translateX(-50%);padding:12px 22px;border:0;border-bottom:1px solid #f4e5d977;background:transparent;text-transform:uppercase;letter-spacing:.42em;font-size:.72rem;color:#f6ead7;opacity:0;visibility:hidden;transition:opacity .8s,letter-spacing .4s;cursor:pointer}.begin.ready,.portal-enter.ready{opacity:1;visibility:visible}.begin:hover,.portal-enter:hover{letter-spacing:.62em}
.prompt{position:absolute;top:max(70px,calc(env(safe-area-inset-top) + 58px));left:12px;right:12px;font-size:.67rem;line-height:1.5;letter-spacing:.13em;color:#e0d5d8;opacity:.78;pointer-events:none;text-shadow:0 2px 15px #090914}.galaxy-title,.garden-title{position:absolute;top:max(42px,env(safe-area-inset-top));left:0;right:0;font:400 .66rem var(--sans);letter-spacing:.38em;text-transform:uppercase;color:#d5c5d4;opacity:.72}
.garden-path{position:absolute;bottom:max(10vh,65px);left:50%;transform:translateX(-50%);border:0;background:transparent;font-size:.75rem;letter-spacing:.4em;color:var(--gold);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.5s}.garden-path.ready{opacity:1;visibility:visible;pointer-events:auto;cursor:pointer}
.machine-hit{position:absolute;width:min(50vw,330px);height:min(50vw,330px);min-width:170px;min-height:170px;border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:manipulation}.machine-hit:focus-visible{outline-offset:-3px}
.final-copy{position:absolute;z-index:2;top:65%;left:18px;right:18px;opacity:0;transform:translateY(calc(-50% + 16px));transition:opacity 2s 2s,transform 2s 2s}.final.active .final-copy{opacity:1;transform:translateY(-50%)}.final h1{font:400 clamp(3rem,10.8vw,8.6rem)/.88 var(--serif);letter-spacing:.035em;margin:0;text-shadow:0 0 52px #f5d7b955}.final .name{display:block;font:400 clamp(1.1rem,3vw,2rem) var(--serif);letter-spacing:.28em;color:var(--gold);margin-top:20px}.letter-link{display:inline-block;margin-top:23px;padding:10px 12px;color:#e7d4cf;text-decoration:none;text-transform:uppercase;font-size:.62rem;letter-spacing:.25em;border-bottom:1px solid #efd39e77;transition:color .3s,border-color .3s}.letter-link:hover{color:var(--gold);border-color:var(--gold)}
.final-orb{position:absolute;z-index:3;left:50%;top:35%;width:clamp(56px,9vw,100px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid #ffe2a788;border-radius:50%;background:radial-gradient(circle at 42% 36%,#fff8dc,#eecb88 24%,#d78f9e88 47%,transparent 70%);box-shadow:0 0 22px #f4d593aa,0 0 105px #d9a1c377;cursor:pointer;transition:transform .5s,box-shadow .5s;animation:orbreathe 4s ease-in-out infinite}.final-orb:hover{transform:translate(-50%,-50%) scale(1.13);box-shadow:0 0 36px #fff1bf,0 0 145px #d9a1c3aa}
.replay{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));right:max(24px,env(safe-area-inset-right));z-index:5;border:0;background:none;color:#c9bbbc;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;opacity:.66;cursor:pointer}.replay:hover{opacity:1;color:var(--gold)}
.progress{position:fixed;left:50%;bottom:max(21px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;gap:13px;opacity:.45;transition:opacity .6s}.progress span{width:3px;height:3px;border-radius:50%;background:#e9d9ce;transition:transform .5s,background .5s}.progress span.on{transform:scale(2);background:var(--gold)}
.sound{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:6;padding:8px;border:0;background:none;color:#e9d9ce;cursor:pointer;font-size:.68rem;letter-spacing:.1em}
@keyframes orbreathe{50%{filter:brightness(1.15);box-shadow:0 0 35px #ffe8b4,0 0 125px #d9a1c377}}@keyframes universeflash{0%{opacity:.88}100%{opacity:0}}.final.flash:before{content:"";position:absolute;inset:0;z-index:1;background:#fff2cf;pointer-events:none;animation:universeflash .7s ease-out forwards}
@media(max-width:600px){.scene{padding-left:18px;padding-right:18px}.wordmark{letter-spacing:.22em}.begin,.portal-enter{bottom:max(13vh,74px);min-width:104px;min-height:44px}.prompt{top:max(76px,calc(env(safe-area-inset-top) + 64px));font-size:.66rem;letter-spacing:.11em}.galaxy-title,.garden-title{top:max(28px,env(safe-area-inset-top));font-size:.6rem;letter-spacing:.25em}.garden-path{bottom:max(13vh,76px);min-height:44px;padding:12px 8px;font-size:.65rem;letter-spacing:.25em}.machine-hit{width:min(76vw,300px);height:min(76vw,300px);min-width:190px;min-height:190px}.final-orb{top:31%;width:clamp(58px,17vw,76px)}.final-copy{top:66%;left:12px;right:12px}.final h1{font-size:clamp(2.15rem,9.7vw,3.6rem);line-height:.98;letter-spacing:.015em}.final .name{font-size:clamp(1.05rem,4vw,1.4rem);letter-spacing:.18em;margin-top:15px}.letter-link{margin-top:16px;min-height:44px;padding-top:13px}.replay{bottom:max(52px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));font-size:.58rem}.progress{bottom:max(27px,env(safe-area-inset-bottom))}}
@media(orientation:landscape) and (max-height:520px){.scene{padding-top:24px;padding-bottom:56px}.begin,.portal-enter{bottom:6vh}.galaxy-title,.garden-title{top:22px}.prompt{top:52px}.garden-path{bottom:6vh}.final-orb{top:28%;width:56px}.final-copy{top:65%}.final h1{font-size:clamp(2.5rem,7vw,4.2rem)}.letter-sheet{padding:25px 32px}.letter-sheet h2{margin-bottom:12px}.letter-copy{line-height:1.55}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.1ms!important}}
</style>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<main class="world">
<section class="scene active" id="void" aria-label="The void" tabindex="0"><div class="prompt">Touch four stars</div><button class="begin" id="begin" type="button">BEGIN</button></section>
<section class="scene" id="galaxy" aria-label="The galaxy" tabindex="0"><div class="galaxy-title">II　·　the galaxy engine</div><div class="prompt">Drag to turn · touch each planet</div><button class="portal-enter" id="enterGarden" type="button">ENTER</button></section>
<section class="scene" id="garden" aria-label="The night garden" tabindex="0"><div class="garden-title">III　·　the garden at night</div><div class="prompt">Bloom the flowers · find the gold one</div><button class="garden-path" id="gardenPath" type="button">FOLLOW THE LIGHT</button></section>
<section class="scene" id="chaos" aria-label="The chaos machine" tabindex="0"><div class="prompt">Tap the machine until it opens</div><button class="machine-hit" id="machine" type="button" aria-label="Touch the mysterious machine"></button></section>
<section class="scene final" id="final" aria-label="Birthday reveal" tabindex="0"><div class="prompt">Tap the light</div><div class="final-copy"><h1 id="greeting">HAPPY<br>BIRTHDAY</h1><span class="name" id="friendName">BEST FRIEND</span><a class="letter-link" href="letter.html">A little letter ↗</a></div><button class="final-orb" id="finalOrb" aria-label="Illuminate the universe"></button><button class="replay" id="replay" type="button">↺ &nbsp; again</button></section>
<div class="progress" aria-hidden="true"><span class="on"></span><span></span><span></span><span></span><span></span></div>
</main>
<script>
// Personalize the greeting here. Sound is off by default and never starts without a tap.
const CONFIG={friendName:"BEST FRIEND",birthdayGreeting:"HAPPY BIRTHDAY",particleIntensity:"high",enableSound:false,enableParallax:true};
const canvas=document.getElementById("art"),ctx=canvas.getContext("2d"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ids=["void","galaxy","garden","chaos","final"],scenes=ids.map(id=>document.getElementById(id)),dots=[...document.querySelectorAll(".progress span")];
document.getElementById("friendName").textContent=CONFIG.friendName;
document.getElementById("greeting").innerHTML=CONFIG.birthdayGreeting.replace(/\n/g,"<br>");
let W=0,H=0,D=1,active=0,last=performance.now(),pointer={x:.5,y:.5,down:false},voidStars=[],planets=[],flowers=[],particles=[],petals=[],ripples=[],phase=0,clock=0,voidClicks=0,discovered=new Set(),bloomed=new Set(),specialAwake=false,machineClicks=0,chaosLevel=0,finalStarted=false,secretTimer=0,lastEffect=-1,galaxyRotation=0,dragStart=null;
const intensity=CONFIG.particleIntensity==="high"?1:CONFIG.particleIntensity==="low"?.42:.7;
function resize(){D=Math.min(devicePixelRatio||1,1.7);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(D,0,0,D,0,0);seedVoid();seedPlanets();seedFlowers()}
function seedVoid(){voidStars=Array.from({length:26},(_,i)=>({x:W*(.23+Math.random()*.54),y:H*(.2+Math.random()*.58),r:i===0?3:1+Math.random()*1.3,bright:0,hit:false,phase:Math.random()*6.28}));voidStars[0].x=W*.5;voidStars[0].y=H*.49}
function seedPlanets(){planets=[{r:.13,size:7,hue:342,speed:.35,phase:.1},{r:.20,size:5,hue:42,speed:-.23,phase:1.7},{r:.27,size:9,hue:187,speed:.16,phase:3.2},{r:.34,size:6,hue:265,speed:-.12,phase:4.5},{r:.39,size:4,hue:28,speed:.085,phase:5.5}]}
function seedFlowers(){flowers=Array.from({length:7},(_,i)=>({x:W*(.13+i*.12),y:H*(.70+(i%3)*.035),size:7+(i%3)*2,hue:i===5?48:[340,290,186,35,318,52,198][i],phase:Math.random()*6.28, special:i===5}))}
addEventListener("resize",resize);resize();
if(CONFIG.enableParallax&&!matchMedia("(pointer:coarse)").matches)addEventListener("pointermove",e=>{pointer.x=e.clientX/W;pointer.y=e.clientY/H});
function go(n){active=n;scenes.forEach((s,i)=>s.classList.toggle("active",i===n));dots.forEach((d,i)=>d.classList.toggle("on",i===n));phase=0;last=performance.now();scenes[n].focus({preventScroll:true});if(n===4)beginFinal();if(reduced)draw(0)}
function clickAt(x,y){pointer.x=x/W;pointer.y=y/H;if(active===0){let nearest=-1,dist=Infinity;voidStars.forEach((s,i)=>{const d=Math.hypot(x-s.x,y-s.y);if(d<dist){dist=d;nearest=i}});if(nearest>=0&&dist<Math.max(36,W*.075)){if(!voidStars[nearest].hit)voidClicks++;voidStars[nearest].hit=true;voidStars[nearest].bright=1;emit(voidStars[nearest].x,voidStars[nearest].y,12,45);if(voidClicks>=4){phase=Math.max(phase,.8);document.getElementById("begin").classList.add("ready")}}}
else if(active===1){const cx=W/2,cy=H/2,dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);if(d<Math.max(32,W*.04)){emit(cx,cy,70,48);return}let found=-1,best=Infinity;planets.forEach((p,i)=>{const a=p.phase+clock*p.speed+galaxyRotation,px=cx+Math.cos(a)*Math.min(W,H)*.40*p.r/.38,py=cy+Math.sin(a)*Math.min(W,H)*.40*p.r/.38*.62,dd=Math.hypot(px-x,py-y);if(dd<best){best=dd;found=i}});if(found>=0&&best<Math.max(32,W*.055)){discovered.add(found);emit(x,y,24,planets[found].hue);if(discovered.size===planets.length)document.getElementById("enterGarden").classList.add("ready")}}
else if(active===2){let found=-1,best=Infinity;flowers.forEach((f,i)=>{const d=Math.hypot(x-f.x,y-f.y);if(d<best){best=d;found=i}});if(found>=0&&best<Math.max(55,W*.09)){bloomed.add(found);if(flowers[found].special)specialAwake=true;emit(flowers[found].x,flowers[found].y-8,flowers[found].special?50:16,flowers[found].hue);ripples.push({x:W*.5,y:H*.78,r:2,a:.8});if(specialAwake&&bloomed.size>=4){document.getElementById("gardenPath").classList.add("ready");phase=Math.max(phase,1)}}}
}
document.querySelector(".world").addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;pointer.down=true;dragStart={x:e.clientX,y:e.clientY}});
document.querySelector(".world").addEventListener("pointerup",e=>{if(e.target.closest("button"))return;pointer.down=false;const dx=e.clientX-(dragStart?.x||e.clientX);if(active===1&&Math.abs(dx)>5){galaxyRotation+=dx*.008}else clickAt(e.clientX,e.clientY);dragStart=null});
document.getElementById("begin").addEventListener("click",()=>go(1));
document.getElementById("enterGarden").addEventListener("click",()=>go(2));
document.getElementById("gardenPath").addEventListener("click",()=>go(3));
document.getElementById("machine").addEventListener("click",()=>machineTap());
document.getElementById("finalOrb").addEventListener("click",finalFlash);
document.getElementById("replay").addEventListener("click",reset);
document.addEventListener("keydown",e=>{if(e.target!==scenes[active])return;if(active===1&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){galaxyRotation+=(e.key==="ArrowRight"?1:-1)*.12;e.preventDefault();if(reduced)draw(0);return}if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();if(active===0){const s=voidStars.find(q=>!q.hit);if(s)clickAt(s.x,s.y)}else if(active===1){const i=planets.findIndex((_,j)=>!discovered.has(j));if(i>=0){const p=planets[i],a=p.phase+clock*p.speed+galaxyRotation,r=Math.min(W,H)*.40*p.r/.38;clickAt(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r*.62)}else emit(W/2,H/2,55,48)}else if(active===2){const f=flowers.find((_,i)=>!bloomed.has(i));if(f)clickAt(f.x,f.y)}else if(active===3)machineTap();else finalFlash()});
function reset(){voidClicks=0;discovered.clear();bloomed.clear();specialAwake=false;machineClicks=0;chaosLevel=0;finalStarted=false;document.getElementById("machine").disabled=false;particles.length=0;petals.length=0;document.getElementById("begin").classList.remove("ready");document.getElementById("enterGarden").classList.remove("ready");document.getElementById("gardenPath").classList.remove("ready");document.getElementById("greeting").innerHTML=CONFIG.birthdayGreeting.replace(/\n/g,"<br>");document.getElementById("friendName").textContent=CONFIG.friendName;seedVoid();seedPlanets();seedFlowers();go(0)}
function emit(x,y,n,hue){n=Math.min(n,Math.max(0,800-particles.length),Math.max(160,Math.floor(Math.min(W,H)*1.4)));for(let i=0;i<n*intensity;i++){const a=Math.random()*Math.PI*2,v=.45+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:.8+Math.random()*2.4,life:1,hue:hue+(Math.random()*22-11),decay:.009+Math.random()*.013})}if(reduced)draw(0)}
function machineTap(){if(active!==3)return;machineClicks++;chaosLevel=Math.min(1,machineClicks/8);const weights=[1.4,1.2,1.15,1,1,.95,.9,.75,.75],pool=[];weights.forEach((weight,index)=>{if(index!==lastEffect)for(let k=0;k<Math.round(weight*10);k++)pool.push(index)});const effect=pool[Math.floor(Math.random()*pool.length)];lastEffect=effect;const colors=[340,45,190,270,10,310,185,50,340],n=[40,64,52,42,70,48,85,60,55][effect]+machineClicks*3;emit(W/2,H/2,n,colors[effect]);if(effect===2||effect===8){for(let i=0;i<9;i++)petals.push({x:W/2,y:H/2,vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,rot:Math.random()*6.2,life:1,hue:colors[effect]})}if(effect===3)canvas.style.filter="hue-rotate(42deg)";else canvas.style.filter="none";if(effect===4||effect===7)ripples.push({x:W/2,y:H/2,r:4,a:.95});if(effect===0||effect===7)for(let i=0;i<4;i++)emit(W*(.2+Math.random()*.6),H*(.2+Math.random()*.6),24,colors[effect]);setTimeout(()=>canvas.style.filter="none",450);if(machineClicks>=8){document.getElementById("machine").disabled=true;setTimeout(()=>{if(active===3){chaosLevel=1;phase=0;secretTimer=performance.now()+1500;setTimeout(()=>{if(active===3)go(4)},2700)}},250)}}
function beginFinal(){if(finalStarted)return;finalStarted=true;phase=0;emit(W/2,H/2,CONFIG.particleIntensity==="high"?310:180,44);setTimeout(()=>{if(active===4)phase=1},1200)}
function finalFlash(){emit(W/2,H/2,220,48);for(let i=0;i<35;i++)petals.push({x:W/2,y:H/2,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,rot:Math.random()*6,life:1,hue:Math.random()<.5?340:48});document.getElementById("final").classList.add("flash");setTimeout(()=>document.getElementById("final").classList.remove("flash"),700)}
document.getElementById("final").addEventListener("transitionend",()=>{});
function drawBackground(dt){ctx.fillStyle="rgba(5,7,18,"+(active===2?.23:.34)+")";ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.48,Math.max(W,H)*.72);const warmth=active===2&&specialAwake?"rgba(58,91,100,.29)":active===0&&voidClicks>=4?"rgba(42,56,103,.38)":active===4?"rgba(81,49,77,.26)":"rgba(35,37,75,.18)";g.addColorStop(0,warmth);g.addColorStop(1,"rgba(4,6,17,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(active!==2)drawStars(dt)}
function drawStars(dt){for(let i=0;i<voidStars.length;i++){const s=voidStars[i];if(active===0){s.bright=Math.max(s.bright,s.hit?1:0);const d=Math.hypot(pointer.x*W-s.x,pointer.y*H-s.y),near=Math.max(0,1-d/Math.max(100,W*.22));s.bright=Math.max(s.bright,near*.55);const a=i===0?.38+.52*(.5+.5*Math.sin(clock*3.2)):.08+s.bright*.8;ctx.globalAlpha=a;ctx.fillStyle=s.hit?"#fff1cc":"#e7e6f5";if(i===0){ctx.shadowBlur=18+near*12;ctx.shadowColor="#f2d99f"}ctx.beginPath();ctx.arc(s.x,s.y,s.r+near*2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}
else if(active!==2){const x=s.x,y=s.y;ctx.globalAlpha=.15+.2*Math.sin(clock*1.4+s.phase);ctx.fillStyle="#ecebff";ctx.fillRect(x,y,s.r,s.r);ctx.globalAlpha=1}}
if(active===0){ctx.save();ctx.strokeStyle="#d9c5e4";ctx.lineWidth=1;const order=[0,3,8,12,18,23,20,14,10,5,2,0];order.forEach((n,i)=>{const a=voidStars[n],b=voidStars[order[(i+1)%order.length]],power=Math.max(a.bright,b.bright);ctx.globalAlpha=.05+power*.28;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});ctx.restore();let total=voidStars.filter(s=>s.hit).length;if(total>=4){ctx.globalAlpha=.35+.3*Math.sin(clock*3);ctx.fillStyle="#f2e1c4";ctx.beginPath();ctx.arc(W/2,H*.49,15+Math.sin(clock*2)*4,0,7);ctx.fill();ctx.globalAlpha=1}}
if(active===4)drawFinalSky()}
function drawGalaxy(dt){const cx=W/2,cy=H*.51,R=Math.min(W,H)*.40;ctx.save();ctx.translate(cx,cy);ctx.rotate(galaxyRotation);for(let j=0;j<planets.length;j++){const p=planets[j],r=R*p.r/.38;ctx.globalAlpha=.12;ctx.strokeStyle="hsl("+p.hue+" 55% 78%)";ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,r,r*.62,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;const a=p.phase+clock*p.speed,x=Math.cos(a)*r,y=Math.sin(a)*r*.62;ctx.shadowBlur=14;ctx.shadowColor="hsl("+p.hue+" 72% 72%)";ctx.fillStyle="hsl("+p.hue+" 63% 78%)";ctx.beginPath();ctx.arc(x,y,p.size*(W<600?.8:1),0,7);ctx.fill();ctx.shadowBlur=0;if(discovered.has(j)){ctx.globalAlpha=.75;ctx.strokeStyle="hsl("+p.hue+" 72% 82%)";ctx.beginPath();ctx.arc(x,y,p.size+5+Math.sin(clock*3)*2,0,7);ctx.stroke();ctx.globalAlpha=1}}
const pulse=1+Math.sin(clock*2)*.09;ctx.shadowBlur=38;ctx.shadowColor="#f2cb83";const core=ctx.createRadialGradient(-7,-9,1,0,0,31*pulse);core.addColorStop(0,"#fff8dc");core.addColorStop(.3,"#f5d89b");core.addColorStop(1,"rgba(216,140,165,0)");ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,32*pulse,0,7);ctx.fill();ctx.shadowBlur=0;ctx.restore();if(discovered.size===planets.length){ctx.save();ctx.globalAlpha=.13+.06*Math.sin(clock*2);ctx.strokeStyle="#f0d49a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,Math.min(W,H)*(.38+Math.sin(clock)*.015),0,7);ctx.stroke();ctx.restore()}}
function drawGardenBase(){const awake=specialAwake;const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,awake?"#172c43":"#10152b");sky.addColorStop(.63,awake?"#25384b":"#191b33");sky.addColorStop(1,"#090d1c");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const mx=W*.76,my=H*.2,mr=Math.min(W,H)*(.09+(awake?.025:0));ctx.shadowBlur=awake?36:19;ctx.shadowColor="#eff0d0";ctx.fillStyle="#f3e6c7";ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#20293a";ctx.beginPath();ctx.arc(mx+mr*.36,my-mr*.15,mr*.89,0,7);ctx.fill();ctx.globalAlpha=.18;for(let i=0;i<10;i++){const x=i*W/9;ctx.fillStyle="#080e1c";ctx.beginPath();ctx.moveTo(x,H*.59);ctx.lineTo(x+W*.05,H*(.43+(i%3)*.035));ctx.lineTo(x+W*.10,H*.59);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle="#0a1020";ctx.beginPath();ctx.moveTo(0,H*.61);for(let x=0;x<=W;x+=12)ctx.lineTo(x,H*.62+Math.sin(x*.008+clock*.6)*3);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();const water=ctx.createLinearGradient(0,H*.63,0,H);water.addColorStop(0,"rgba(117,152,173,.24)");water.addColorStop(1,"rgba(10,18,31,.3)");ctx.fillStyle=water;ctx.fillRect(0,H*.63,W,H*.37);for(let i=0;i<22;i++){const yy=H*.67+i*H*.014,xx=mx+Math.sin(i*2+clock)*mr*(.4+i*.025);ctx.globalAlpha=(awake?.12:.05)*(1-i/26);ctx.strokeStyle="#f0d9b5";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xx-10-i,yy);ctx.lineTo(xx+10+i,yy);ctx.stroke()}ctx.globalAlpha=1;flowers.forEach((f,i)=>{const x=f.x,y=f.y,size=f.size*(bloomed.has(i)?1.5:1)*(1+.04*Math.sin(clock*2+f.phase));ctx.shadowBlur=bloomed.has(i)?20:8;ctx.shadowColor="hsl("+f.hue+" 75% 75%)";ctx.fillStyle="hsl("+f.hue+" 68% "+(f.special?"77%":"68%")+")";for(let k=0;k<5;k++){const a=k*Math.PI*2/5;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*size*.8,y+Math.sin(a)*size*.8,size*.56,size*.8,a,0,7);ctx.fill()}ctx.fillStyle="#ffe9bb";ctx.beginPath();ctx.arc(x,y,size*.36,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="#61786c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+size);ctx.lineTo(x-3,H*.88);ctx.stroke()});if(awake){for(let i=0;i<9;i++){ctx.globalAlpha=.35+.35*Math.sin(clock*2+i);ctx.fillStyle="#f1d89e";ctx.beginPath();ctx.arc((i+.5)*W/9,H*.56+Math.sin(clock+i)*12,1.5,0,7);ctx.fill()}ctx.globalAlpha=1}}
function drawFinalSky(){for(let i=0;i<30;i++){const a=i*Math.PI*2/30,r=Math.min(W,H)*(.25+.018*Math.sin(clock*1.4+i));ctx.globalAlpha=.12+.1*Math.sin(clock+i);ctx.fillStyle=i%4===0?"#f2d49a":"#d9c9ef";ctx.beginPath();ctx.arc(W/2+Math.cos(a)*r,H*.45+Math.sin(a)*r*.55,1.3,0,7);ctx.fill()}ctx.globalAlpha=1;const t=ctx.createRadialGradient(W/2,H*.48,0,W/2,H*.48,Math.min(W,H)*.32);t.addColorStop(0,"rgba(235,194,139,"+(phase>.6?".12":".04")+")");t.addColorStop(1,"rgba(235,194,139,0)");ctx.fillStyle=t;ctx.fillRect(0,0,W,H)}
function drawParticles(dt){particles=particles.filter(p=>p.life>0);if(active>=2){if(active===2&&Math.random()<.035&&petals.length<24)petals.push({x:W*(.08+Math.random()*.84),y:H*.77,vx:(Math.random()-.5)*.45,vy:-.35-Math.random()*.55,rot:Math.random()*6.2,life:1,hue:[340,290,186,35,318,52,198][Math.floor(Math.random()*7)]});for(const p of petals){p.x+=p.vx;p.y+=p.vy;p.vy-=.008;p.rot+=.025;p.life-=.004;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.life*.65;ctx.fillStyle="hsl("+p.hue+" 62% 77%)";ctx.beginPath();ctx.ellipse(0,0,3,8,.2,0,7);ctx.fill();ctx.restore()}petals=petals.filter(p=>p.life>0)}
for(const p of particles){if(active===3&&chaosLevel>=1){p.vx+=(W/2-p.x)*.0008;p.vy+=(H/2-p.y)*.0008}p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.vy*=.99;p.life-=p.decay;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="hsl("+p.hue+" 72% 82%)";ctx.shadowBlur=active===4?8:5;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(.2,p.life),0,7);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1;ripples=ripples.filter(r=>r.a>.01);ripples.forEach(r=>{r.r+=dt*.045;r.a*=.986;ctx.globalAlpha=r.a;ctx.strokeStyle="#b8d6d1";ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.22,0,0,7);ctx.stroke()});ctx.globalAlpha=1}
function draw(dt){clock+=dt/1000;phase+=dt/1000;ctx.clearRect(0,0,W,H);drawBackground(dt);if(active===1)drawGalaxy(dt);if(active===2)drawGardenBase();if(active===3&&chaosLevel<1){drawMachine()}drawParticles(dt);if(active===3&&chaosLevel>=1){const cx=W/2,cy=H/2;ctx.globalAlpha=.5+.5*Math.sin(clock*3);ctx.shadowBlur=40;ctx.shadowColor="#f5dba3";ctx.fillStyle="#fff1c6";ctx.beginPath();ctx.arc(cx,cy,9+Math.sin(clock*4)*2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}}
function drawMachine(){const cx=W/2,cy=H/2,beat=1+Math.sin(clock*1.8)*.04;ctx.save();ctx.translate(cx,cy);ctx.rotate(clock*.11);const R=Math.min(W,H)*.15*beat;for(let i=0;i<3;i++){ctx.save();ctx.rotate(i*Math.PI/3);ctx.strokeStyle=i===1?"#e7b3ce":"#c9c4e6";ctx.globalAlpha=.48;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-R);ctx.lineTo(R*.85,0);ctx.lineTo(0,R);ctx.lineTo(-R*.85,0);ctx.closePath();ctx.stroke();ctx.restore()}ctx.rotate(-clock*.22);ctx.shadowBlur=25;ctx.shadowColor="#eacb8e";const orb=ctx.createRadialGradient(-5,-7,1,0,0,R*.48);orb.addColorStop(0,"#fff5cf");orb.addColorStop(.26,"#df9eba");orb.addColorStop(.7,"rgba(136,117,192,.45)");orb.addColorStop(1,"rgba(17,22,43,0)");ctx.fillStyle=orb;ctx.beginPath();ctx.arc(0,0,R*.55,0,7);ctx.fill();ctx.shadowBlur=0;for(let i=0;i<6;i++){const a=clock*(.25+i*.02)+i*Math.PI/3;ctx.fillStyle=i%2?"#eecb8c":"#d5c9f3";ctx.beginPath();ctx.arc(Math.cos(a)*R,Math.sin(a)*R*.68,2.2,0,7);ctx.fill()}ctx.restore()}
function beginFrame(now){if(document.hidden){last=now;requestAnimationFrame(beginFrame);return}const dt=Math.min(40,now-last);last=now;if(reduced){draw(0);return}draw(dt);requestAnimationFrame(beginFrame)}
if(CONFIG.enableSound){const b=document.createElement("button");b.className="sound";b.type="button";b.textContent="♫";b.setAttribute("aria-label","Enable sound");document.body.append(b);let audio; b.onclick=()=>{if(!audio){audio=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=174.61;g.gain.value=.009;o.connect(g).connect(audio.destination);o.start();b.textContent="♫ on"}else if(audio.state==="running"){audio.suspend();b.textContent="♫"}else{audio.resume();b.textContent="♫ on"}}}
requestAnimationFrame(beginFrame);
</script>
